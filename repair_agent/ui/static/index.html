<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保障智能助手</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/d3.min.js"></script>
</head>
<body>
    <!-- ==================== SIDEBAR ==================== -->
    <nav class="sidebar">
        <img src="/static/logo.png" alt="Logo" class="sidebar-logo">

        <div class="sidebar-nav">
            <button class="sidebar-item active" data-tab="diagnosis">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <span>故障诊断</span>
            </button>
            <button class="sidebar-item" data-tab="maintenance">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                <span>日常维护</span>
            </button>
            <button class="sidebar-item" data-tab="qa">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>智能问答</span>
            </button>
            <button class="sidebar-item" data-tab="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span>知识检索</span>
            </button>
            <button class="sidebar-item" data-tab="case">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                <span>案例管理</span>
            </button>
            <button class="sidebar-item" data-tab="feedback">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="15" r="1"/></svg>
                <span>系统反馈</span>
            </button>
            <button class="sidebar-item" data-tab="stats">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>系统统计</span>
            </button>
        </div>

        <div class="sidebar-status">
            <div class="sidebar-status-dot" id="sidebar-status">
                <div class="dot dot-loading" id="status-dot"></div>
                <span id="status-text">初始化中</span>
            </div>
        </div>
    </nav>

    <!-- ==================== MAIN ==================== -->
    <div class="main">
        <div class="topbar">
            <div class="topbar-title" id="topbar-title">故障诊断</div>
            <div class="topbar-actions">
                <a href="/dashboard" target="_blank" class="topbar-dashboard">数据大屏</a>
            </div>
        </div>

        <div class="content">
            <!-- ============ Tab: 故障诊断 ============ -->
            <div class="tab-content active" id="tab-diagnosis">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">输入</div>
                        <button class="btn-demo" onclick="fillDiagnosisDemo()">填充示例</button>
                    </div>
                    <div class="card-body" style="display:flex;flex-direction:column;gap:12px;">
                        <div class="form-group">
                            <label for="fault-desc">故障描述</label>
                            <textarea id="fault-desc" rows="6" placeholder="描述故障现象、设备型号、异常表现等..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="fault-image">上传照片（可选）</label>
                            <input type="file" id="fault-image" accept="image/*">
                            <div id="image-preview" class="image-preview hidden">
                                <img id="preview-img" src="" alt="预览">
                                <button id="remove-image" class="btn-remove">&times;</button>
                            </div>
                        </div>
                        <button id="btn-diagnose" class="btn btn-primary" disabled>开始诊断</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><div class="card-title">推理过程</div></div>
                    <div class="card-body"><div id="cot-area" class="cot-box"><div class="placeholder">等待输入故障描述...</div></div></div>
                </div>

                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div class="card" style="flex:1;">
                        <div class="card-header"><div class="card-title">诊断依据</div></div>
                        <div class="card-body"><div id="evidence-area" class="evidence-box"><div class="placeholder">诊断完成后将显示相关依据...</div></div></div>
                    </div>
                    <div class="card" style="flex:1;">
                        <div class="card-header"><div class="card-title">维修工单</div></div>
                        <div class="card-body"><div id="order-area" class="order-box"><div class="placeholder">诊断完成后将生成工单...</div></div></div>
                    </div>
                </div>
            </div>

            <!-- ============ Tab: 日常维护 ============ -->
            <div class="tab-content" id="tab-maintenance">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">维护需求</div>
                        <button class="btn-demo" onclick="fillMaintenanceDemo()">填充示例</button>
                    </div>
                    <div class="card-body" style="display:flex;flex-direction:column;gap:12px;">
                        <div class="form-group">
                            <label for="maint-desc">维护描述</label>
                            <textarea id="maint-desc" rows="6" placeholder="描述维护类型、设备型号、周期要求等..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="maint-image">上传照片（可选）</label>
                            <input type="file" id="maint-image" accept="image/*">
                            <div id="maint-image-preview" class="image-preview hidden">
                                <img id="maint-preview-img" src="" alt="预览">
                                <button id="maint-remove-image" class="btn-remove">&times;</button>
                            </div>
                        </div>
                        <button id="btn-maintenance" class="btn btn-primary" disabled>生成维护方案</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><div class="card-title">分析过程</div></div>
                    <div class="card-body"><div id="maint-cot-area" class="cot-box"><div class="placeholder">等待输入维护需求...</div></div></div>
                </div>

                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div class="card" style="flex:1;">
                        <div class="card-header"><div class="card-title">维护依据</div></div>
                        <div class="card-body"><div id="maint-evidence-area" class="evidence-box"><div class="placeholder">分析完成后将显示相关维护依据...</div></div></div>
                    </div>
                    <div class="card" style="flex:1;">
                        <div class="card-header"><div class="card-title">维护工单</div></div>
                        <div class="card-body"><div id="maint-order-area" class="order-box"><div class="placeholder">分析完成后将生成工单...</div></div></div>
                    </div>
                </div>
            </div>

            <!-- ============ Tab: 智能问答 ============ -->
            <div class="tab-content" id="tab-qa">
                <div class="card" style="flex:1;">
                    <div class="card-header"><div class="card-title">智能问答</div></div>
                    <div class="card-body" style="display:flex;flex-direction:column;gap:12px;">
                        <div class="form-group">
                            <label for="qa-question">问题</label>
                            <textarea id="qa-question" rows="3" placeholder="输入您的技术问题..."></textarea>
                        </div>
                        <button id="btn-ask" class="btn btn-primary" disabled>提问</button>
                        <div id="qa-answer" style="font-size:13px;line-height:1.8;color:var(--text-secondary);"></div>
                    </div>
                </div>
            </div>

            <!-- ============ Tab: 知识检索 ============ -->
            <div class="tab-content" id="tab-search">
                <div class="card" style="flex:1;max-width:800px;">
                    <div class="card-header"><div class="card-title">知识检索</div></div>
                    <div class="card-body" style="display:flex;flex-direction:column;gap:12px;">
                        <div style="display:flex;gap:8px;">
                            <input type="search" id="search-query" placeholder="输入关键词搜索知识库..." style="flex:1;">
                            <button id="btn-search" class="btn btn-primary" disabled>检索</button>
                        </div>
                        <div id="search-results"></div>
                        <div id="search-history-list" style="font-size:12px;color:var(--text-tertiary);display:flex;gap:8px;flex-wrap:wrap;"></div>
                    </div>
                </div>
            </div>

            <!-- ============ Tab: 案例管理 ============ -->
            <div class="tab-content" id="tab-case">
                <div class="card" style="flex:1;">
                    <div class="card-header"><div class="card-title">案例列表</div></div>
                    <div class="card-body">
                        <div style="display:flex;gap:8px;margin-bottom:12px;">
                            <button class="btn btn-outline btn-sm active" onclick="loadCases()">全部</button>
                            <button class="btn btn-outline btn-sm" onclick="loadCases('repair')">维修案例</button>
                            <button class="btn btn-outline btn-sm" onclick="loadCases('maintenance')">维护案例</button>
                        </div>
                        <div id="case-list"></div>
                    </div>
                </div>
            </div>

            <!-- ============ Tab: 系统反馈 ============ -->
            <div class="tab-content" id="tab-feedback">
                <div class="card" style="flex:1;max-width:600px;">
                    <div class="card-header"><div class="card-title">提交反馈</div></div>
                    <div class="card-body feedback-form">
                        <div class="form-group">
                            <label for="feedback-type">反馈类型</label>
                            <select id="feedback-type"><option value="bug">Bug 报告</option><option value="feature">功能建议</option><option value="other">其他</option></select>
                        </div>
                        <div class="form-group">
                            <label for="feedback-context">使用场景</label>
                            <input type="text" id="feedback-context" placeholder="故障诊断 / 日常维护 / 智能问答...">
                        </div>
                        <div class="form-group">
                            <label for="feedback-issue">问题描述</label>
                            <textarea id="feedback-issue" rows="4" placeholder="详细描述遇到的问题..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="feedback-correct">期望输出（可选）</label>
                            <textarea id="feedback-correct" rows="2" placeholder="您期望的正确结果..."></textarea>
                        </div>
                        <button id="btn-submit-feedback" class="btn btn-primary">提交反馈</button>
                        <div id="feedback-result"></div>
                    </div>
                </div>
            </div>

            <!-- ============ Tab: 系统统计 ============ -->
            <div class="tab-content" id="tab-stats">
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;">
                    <div class="card"><div class="card-title">知识库条目</div><div style="font-size:28px;font-weight:700;color:var(--accent);" id="stat-kb-count">--</div></div>
                    <div class="card"><div class="card-title">记忆记录</div><div style="font-size:28px;font-weight:700;color:var(--success);" id="stat-memory-count">--</div></div>
                    <div class="card"><div class="card-title">诊断记录</div><div style="font-size:28px;font-weight:700;color:var(--warning);" id="stat-diagnosis-count">--</div></div>
                    <div class="card"><div class="card-title">运行状态</div><div style="font-size:28px;font-weight:700;color:var(--success);" id="stat-run-status">运行中</div></div>
                </div>

                <div class="card" style="flex:1;">
                    <div class="card-header"><div class="card-title">知识图谱</div><button class="btn btn-outline btn-sm" onclick="loadKnowledgeGraph()">刷新</button></div>
                    <div class="card-body">
                        <div class="viz-description"><p>QA 知识库章节与问答对关联图谱。绿色线=章节归属，蓝色虚线=跨章语义关联。</p></div>
                        <div class="viz-container" id="kg-container" style="min-height:400px;"></div>
                    </div>
                </div>

                <div class="card" style="flex:1;">
                    <div class="card-header"><div class="card-title">向量空间</div><button class="btn btn-outline btn-sm" onclick="loadVectorSpace()">刷新</button></div>
                    <div class="card-body">
                        <div class="viz-description"><p>t-SNE 降维可视化，距离近的点语义相近。</p></div>
                        <div class="viz-container" id="vs-container" style="min-height:350px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== DETAIL MODAL ==================== -->
    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title" class="modal-title">详情</h3>
                <button id="modal-close" class="modal-close-btn">&times;</button>
            </div>
            <div id="modal-content" class="modal-body"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
